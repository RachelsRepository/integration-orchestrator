# Local development stack.
#
# Everything the platform depends on, plus the API, the workers and a one-shot
# migration job. Service startup is ordered by health rather than by `depends_on`
# alone, because a container that is running is not necessarily a database that
# is accepting connections.
#
# Credentials here are local-only placeholders. The settings validator refuses to
# start with them in a production-like environment.

name: integration-orchestrator

x-app-environment: &app-environment
  ENVIRONMENT: local
  LOG_LEVEL: INFO
  LOG_CONSOLE_RENDERER: "false"
  DATABASE__URL: postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator
  REDIS__URL: redis://redis:6379/0
  KAFKA__ENABLED: "true"
  KAFKA__BOOTSTRAP_SERVERS: kafka:9092
  JWT__SECRET: local-development-signing-secret-not-for-production
  TOKEN_ENCRYPTION__SECRET: local-development-token-encryption-secret-not-for-production
  SECURITY__ENFORCE_SUBJECT_ISOLATION: "false"
  PROVIDER_SANDBOX__ENABLED: "true"
  PROVIDER_SANDBOX__MOUNT_IN_APP: "true"
  OBSERVABILITY__TRACING_ENABLED: "false"
  PROVIDERS__NORTHSTAR__BASE_URL: http://api:8000/__sandbox__/northstar
  PROVIDERS__NORTHSTAR__OAUTH_TOKEN_URL: http://api:8000/__sandbox__/northstar/oauth/token
  PROVIDERS__MERIDIAN__BASE_URL: http://api:8000/__sandbox__/meridian
  PROVIDERS__COBALT__BASE_URL: http://api:8000/__sandbox__/cobalt
  PROVIDERS__COBALT__OAUTH_TOKEN_URL: http://api:8000/__sandbox__/cobalt/oauth/token

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      # Small pool, verbose enough to see what the platform is doing without
      # drowning the log in every SELECT.
      - postgres
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500

  redis:
    image: redis:7-alpine
    ports:
      - "16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["redis-server", "--appendonly", "no", "--save", ""]

  kafka:
    # Redpanda speaks the Kafka protocol and is the durable local/CI broker.
    # The official Apache Kafka KRaft image repeatedly failed broker→controller
    # registration under concurrent local stacks; Redpanda keeps the same
    # bootstrap address (`kafka:9092`) the app already uses.
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:29092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr kafka:33145
      - --advertise-rpc-addr kafka:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --default-log-level=warn
    ports:
      # Host port avoids collision with other local stacks that bind 19092.
      - "29092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-environment
    ports:
      - "18100:8000"
    # Local Compose is not production; these opts mirror hardening expectations.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Second API replica for shared Redis rate-limit and multi-instance probes.
  # Provider sandbox URLs still target `api` so workers have a stable sandbox host.
  api-b:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-environment
    ports:
      - "18101:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  workers:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-environment
    command: ["python", "-m", "integration_orchestrator.workers.runner"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Heartbeat file is refreshed by the worker process; stale means unhealthy.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import time,pathlib; p=pathlib.Path('/tmp/orchestrator-worker-heartbeat'); assert p.exists() and time.time()-float(p.read_text())<30\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # The workers dispatch through the sandbox, which the API hosts, so they
      # wait for it rather than failing their first few batches.
      api:
        condition: service_healthy

volumes:
  postgres-data:
