# Local development stack.
#
# Everything the platform depends on, plus the API, the workers and a one-shot
# migration job. Service startup is ordered by health rather than by `depends_on`
# alone, because a container that is running is not necessarily a database that
# is accepting connections.
#
# Credentials here are local-only placeholders. The settings validator refuses to
# start with them in a production-like environment.

name: integration-orchestrator

x-app-environment: &app-environment
  ENVIRONMENT: local
  LOG_LEVEL: INFO
  LOG_CONSOLE_RENDERER: "false"
  DATABASE__URL: postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator
  REDIS__URL: redis://redis:6379/0
  KAFKA__ENABLED: "true"
  KAFKA__BOOTSTRAP_SERVERS: kafka:9092
  JWT__SECRET: local-development-signing-secret-not-for-production
  PROVIDER_SANDBOX__ENABLED: "true"
  PROVIDER_SANDBOX__MOUNT_IN_APP: "true"
  OBSERVABILITY__TRACING_ENABLED: "false"
  PROVIDERS__NORTHSTAR__BASE_URL: http://api:8000/__sandbox__/northstar
  PROVIDERS__NORTHSTAR__OAUTH_TOKEN_URL: http://api:8000/__sandbox__/northstar/oauth/token
  PROVIDERS__MERIDIAN__BASE_URL: http://api:8000/__sandbox__/meridian
  PROVIDERS__COBALT__BASE_URL: http://api:8000/__sandbox__/cobalt
  PROVIDERS__COBALT__OAUTH_TOKEN_URL: http://api:8000/__sandbox__/cobalt/oauth/token

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      # Small pool, verbose enough to see what the platform is doing without
      # drowning the log in every SELECT.
      - postgres
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["redis-server", "--appendonly", "no", "--save", ""]

  kafka:
    # KRaft mode: no ZooKeeper, which removes an entire container and its
    # coordination failure modes from local development.
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  workers:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *app-environment
    command: ["python", "-m", "integration_orchestrator.workers.runner"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # The workers dispatch through the sandbox, which the API hosts, so they
      # wait for it rather than failing their first few batches.
      api:
        condition: service_healthy

volumes:
  postgres-data:
