name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, types and boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run mypy

      # Architecture is enforced, not just described. This step fails if the
      # domain imports a framework or the application layer imports SQLAlchemy.
      - name: Enforce architectural boundaries
        run: uv run lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator
          POSTGRES_DB: orchestrator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orchestrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE__URL: postgresql+asyncpg://orchestrator:orchestrator@localhost:5432/orchestrator_test
      REDIS__URL: redis://localhost:6379/0
      # Kafka is exercised by the outbox publisher's own tests against an
      # in-memory publisher. Standing up a broker for every run would add minutes
      # to CI to test a client library rather than this platform's logic.
      KAFKA__ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Verify the models match the migrations
        run: uv run python scripts/check_migrations.py

      - name: Run tests
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: integration-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image starts and reports liveness
        run: |
          docker run --rm -d --name orchestrator-ci -p 8000:8000 \
            -e ENVIRONMENT=local \
            -e DATABASE__URL=postgresql+asyncpg://unused:unused@127.0.0.1:5432/unused \
            -e KAFKA__ENABLED=false \
            integration-orchestrator:ci
          # Liveness deliberately does not touch dependencies, so this passes
          # without a database. That is the property being verified.
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health/live; then
              echo "the container reported liveness"
              docker stop orchestrator-ci
              exit 0
            fi
            sleep 2
          done
          echo "the container never reported liveness"
          docker logs orchestrator-ci
          docker stop orchestrator-ci
          exit 1

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform -chdir=terraform fmt -recursive -check

      - name: Validate the dev environment
        run: |
          terraform -chdir=terraform/environments/dev init -backend=false
          terraform -chdir=terraform/environments/dev validate
